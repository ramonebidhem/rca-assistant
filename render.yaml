# Render blueprint — deploys the app as one web service + one Postgres database.
# In Render: New → Blueprint → connect this repo. Everything below is created
# automatically; DATABASE_URL and JWT_SECRET are wired/generated for you.
databases:
  - name: rca-assistant-db
    databaseName: rca_assistant
    user: rca_assistant
    plan: free

services:
  - type: web
    name: rca-assistant
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rca-assistant-db
          property: connectionString
      # Generated once by Render and kept stable across deploys.
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: CLIENT_DIR
        value: /app/client
      - key: PORT
        value: 4000
      # Same-origin app: leave empty so the API reflects the request origin.
      - key: CORS_ORIGIN
        value: ''
      # Render prompts for this on first deploy — set a strong admin password.
      # Used only when the admin user is first created.
      - key: ADMIN_PASSWORD
        sync: false
